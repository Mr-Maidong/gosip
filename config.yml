udp: 0.0.0.0:55060 # sip 服务器 udp 端口
tcp: 0.0.0.0:55060 # sip 服务器 tcp 端口
api: 0.0.0.0:8090 # sip 服务 restfulapi 端口
secret: z9hG4bK1233983766 # restful 接口验证 key 验证请求使用
