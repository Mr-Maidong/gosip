stream:
  hls: 1 # 是否开启视频流转 hls
  rtmp: 1 # 是否开启视频流转 rtmp
gb28181: # gb28181 域，系统 id，用户 id，通道 id，用户数量，初次运行使用配置，之后保存数据库，如果数据库不存在使用配置文件内容
  lid:    33010000002000000001 # 系统 ID
  region: 3301000000           # 系统域
  did:    33010000001118       # 设备前缀
  cid:    33010000001318       # 通道前缀
  dnum:   0 # 设备 id = did + dnum
  cnum:   0 # 通道 id = cid + cnum
  pwd:    123456 # 默认设备接入密码
notify:
  devices_unknown: # 未知设备通知
  devices_active: # 设备活跃通知
  devices_regiest: #设备注册成功通知
  channels_active:  # 通道活跃通知

