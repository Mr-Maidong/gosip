jwt:
  token_expire: 7 # JWT Token 有效期（天），默认 7 天
media:
  restful: http://192.168.1.192:18080 # media 服务器 restfulapi 地址
  http: http://192.168.1.192:18080  # media 服务器 http 请求地址
  ws: ws://192.168.1.192:18080  # media 服务器 ws 请求地址
  rtmp: rtmp://192.168.1.192:1935  # media 服务器 rtmp 请求地址
  rtsp: rtsp://192.168.1.192:8554   # media 服务器 rtsp 请求地址
  rtp: http://192.168.1.192:10000  # media rtp 请求地址 zlm 对外开放的接受 rtp 推流的地址
